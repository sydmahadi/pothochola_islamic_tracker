name: Build Prohori APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check app icon
        run: |
          if [ ! -f prohori.png ]; then
            echo "ERROR: prohori.png was not found in repository root."
            exit 1
          fi

      - name: Generate fresh Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name pothochola_islamic_tracker \
            --org com.pathchola \
            /tmp/pathchola_scaffold

          rm -rf android
          mkdir -p android
          cp -R /tmp/pathchola_scaffold/android/. android/

      - name: Set app display name
        run: |
          sed -i \
            's/android:label="[^"]*"/android:label="প্রহরী"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Install launcher icon generator
        run: flutter pub add --dev flutter_launcher_icons

      - name: Configure app icon
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "prohori.png"
            min_sdk_android: 21
          EOF

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Clean old build artifacts
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Show shared preferences versions
        run: flutter pub deps

      - name: Check Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prohori-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
